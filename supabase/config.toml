# Configuration Supabase CLI — identifiant LOCAL du projet (nom du dossier),
# pas l'identifiant du projet distant. Le lien vers le projet distant se fait
# avec `supabase link --project-ref <ref>` une fois le projet Supabase Iris créé
# (voir docs/demarrage.md).
project_id = "iris"

# Les edge functions à venir (attachments-maintenance — purge de la zone
# d'attente des pièces et outbox de suppression d'objets —, process-webhook-outbox)
# seront déclarées ici avec leur verify_jwt, selon docs/architecture-proposee.md §8.2 :
#   demandes-api / jobs internes → verify_jwt = false (auth portée par le code)
#   socle-proxy                  → verify_jwt = false EN PRATIQUE : le JWT de
#     l'agent est vérifié en code (et le périmètre revérifié), la passerelle
#     rejetant sinon les préflights OPTIONS du navigateur.

# ── Edge functions ───────────────────────────────────────────────────────────
# API d'ingestion serveur-à-serveur : aucun JWT — l'authentification est portée
# par la clé d'intégration (Bearer irs_…), vérifiée dans le code. Les deux
# routes de documentation du contrat (`/`, `/v1/openapi.json`) sont publiques.
[functions.requests-api]
verify_jwt = false

# Hook « Send Email » de GoTrue : appelé sans JWT, authentifié par signature
# Standard Webhooks dans le code (docs/emails.md).
[functions.auth-email-hook]
verify_jwt = false

# JWT vérifié en code, pour laisser passer les préflights OPTIONS du navigateur.
[functions.admin-users]
verify_jwt = false

# Idem : JWT de l'agent vérifié EN CODE (et périmètre revérifié tenant par
# tenant) — la passerelle bloquerait les préflights OPTIONS sans Authorization.
[functions.socle-proxy]
verify_jwt = false

# Idem — création de demande depuis une démarche Socle.
[functions.create-request-from-procedure]
verify_jwt = false

# Deux appelants : pg_cron (en-tête x-cron-secret, sans JWT) et l'application
# (JWT vérifié en code). L'authentification est donc portée par la fonction
# elle-même — elle sert aussi le miroir du serveur d'envoi (docs/emails.md).
[functions.sync-socle-referentiel]
verify_jwt = false

# Assistant IA : JWT de l'agent vérifié EN CODE (préflights OPTIONS), droits
# revérifiés en SQL (request_right_for / has_any_creation_right_for).
[functions.request-assistant]
verify_jwt = false

# Facteur de la boîte d'envoi des notifications : appelée UNIQUEMENT par
# pg_cron (en-tête x-cron-secret, sans JWT). Jamais depuis un navigateur, donc
# aucun CORS non plus.
[functions.notifications-mailer]
verify_jwt = false

# Facteur de la boîte d'envoi PUSH (Web Push / VAPID) : même porte que le
# mailer — pg_cron seul, en-tête x-cron-secret, aucun CORS.
[functions.notifications-push]
verify_jwt = false

# Idem — réponse à l'usager depuis l'onglet Échanges de la fiche demande
# (droit d'instruction revérifié en SQL, destinataire résolu côté serveur).
[functions.send-request-email]
verify_jwt = false

# Idem — génération d'un document du dossier depuis un modèle Word (droit
# d'instruction revérifié en SQL, contexte de fusion composé côté serveur).
[functions.generate-request-document]
verify_jwt = false

# Entretien du bucket des pièces : appelée UNIQUEMENT par pg_cron (en-tête
# x-cron-secret, sans JWT) — purge de la zone d'attente, outbox de suppression
# d'objets, réconciliation manuelle. Jamais depuis un navigateur, aucun CORS.
[functions.attachments-maintenance]
verify_jwt = false

# Idem — LA porte du navigateur vers le bucket des pièces (2026-09-08) :
# réception multipart, type réel vérifié, zone d'attente. Droits revérifiés en
# SQL AVANT de lire le corps (création sur le tenant, ou instruction sur la
# demande).
[functions.request-attachments]
verify_jwt = false
